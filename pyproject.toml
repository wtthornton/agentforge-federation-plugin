[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-federation-plugin"
version = "1.0.0"
description = "Test rig for AgentForge frontend federation — iframe widget mount, nav render, remote_url surface."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.0"]

[project.entry-points."agentforge.plugins"]
federation-test = "agentforge_federation"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_federation"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_federation/plugin.json" = "agentforge_federation/plugin.json"
"agentforge_federation/agents/federation_test_agent/AGENT.md" = "agentforge_federation/agents/federation_test_agent/AGENT.md"

[dependency-groups]
dev = ["pytest>=9.0", "httpx>=0.28"]
